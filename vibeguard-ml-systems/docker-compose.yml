services:
  vibeguard-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      VIBEGUARD_CHECKPOINT: /app/artifacts/model.pt
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 3
