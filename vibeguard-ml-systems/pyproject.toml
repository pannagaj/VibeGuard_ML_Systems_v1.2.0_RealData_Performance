[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeguard-ml-systems"
version = "1.2.0"
description = "End-to-end PyTorch ML systems, motor-vibration fault classification, inference, and optimization benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pannaga J P" }]
keywords = ["machine-learning", "pytorch", "time-series", "predictive-maintenance", "mlops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "torch>=2.4,<3",
  "joblib>=1.4,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "httpx>=0.27,<1"]
quantization = ["torchao>=0.17,<0.18"]
realdata = ["scipy>=1.13,<2", "psutil>=5.9,<8"]

[project.scripts]
vibeguard = "vibeguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["vibeguard"]
branch = true
